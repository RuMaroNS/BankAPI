<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Login</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: #0a0a0a; 
            color: #fff; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
        }
        .card { 
            width: 320px; 
            padding: 30px; 
            background: #161616; 
            border: 1px solid #333; 
            border-radius: 20px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            text-align: center;
        }
        h2 { margin-bottom: 25px; font-weight: 300; }
        input { 
            width: 100%; 
            padding: 12px; 
            margin-bottom: 15px; 
            background: #222; 
            border: 1px solid #444; 
            border-radius: 8px; 
            color: #fff; 
            box-sizing: border-box;
        }
        button { 
            width: 100%; 
            padding: 12px; 
            background: #007bff; 
            border: none; 
            border-radius: 8px; 
            color: white; 
            font-weight: bold; 
            cursor: pointer; 
            transition: 0.3s;
        }
        button:hover { background: #0056b3; }
        #balance-display { font-size: 2.5em; color: #00ff9d; margin: 20px 0; }
    </style>
</head>
<body>

<div class="card">
    <div id="auth-section">
        <h2>Вход в систему</h2>
        <input type="text" id="phone-input" placeholder="Номер телефона">
        <button onclick="login()">Войти</button>
    </div>

    <div id="app-section" style="display:none;">
        <h2>Твой баланс</h2>
        <div id="balance-display">0 ₽</div>
        <button onclick="location.reload()" style="background: #444;">Выйти</button>
    </div>
</div>

<script>
    // Инициализация один раз
    const supabaseClient = supabase.createClient(
        'https://olcfpuuomjazzhmdvdjn.supabase.co',
        'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9sY2ZwdXVvbWphenpobWR2ZGpuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAwNDE2NDgsImV4cCI6MjA5NTYxNzY0OH0.M2S32dxdljB6qpdzFuCd1f2P32Mg4lhoRq0P9kIPzOQ'
    );

    async function login() {
        const phone = document.getElementById('phone-input').value;
        const { data, error } = await supabaseClient
            .from('users')
            .select('balance')
            .eq('phone', phone)
            .single();

        if (data) {
            document.getElementById('auth-section').style.display = 'none';
            document.getElementById('app-section').style.display = 'block';
            document.getElementById('balance-display').innerText = data.balance + ' ₽';
        } else {
            alert('Пользователь не найден. Ошибка: ' + (error ? error.message : 'Неизвестная ошибка'));
        }
    }
</script>

</body>
</html>
