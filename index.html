<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Банк</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="constants.js"></script>
</head>
<body>
    <input type="text" id="phone-input" placeholder="Номер телефона">
    <button onclick="login()">Войти</button>
    <div id="balance-display"></div>

    <script>
        const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        async function login() {
            const phone = document.getElementById('phone-input').value;
            const { data, error } = await supabase.from('users').select('balance').eq('phone', phone).single();
            if (data) {
                document.getElementById('balance-display').innerText = "Баланс: " + data.balance + "₽";
            } else {
                alert("Ошибка: " + (error ? error.message : "Не найден"));
            }
        }
    </script>
</body>
</html>
