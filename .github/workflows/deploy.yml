name: CI/CD Pipeline
on: 
  push:
  workflow_dispatch:
  # ЭТОТ CRON ЗАСТАВЛЯЕТ БОТА ПЕРЕЗАПУСКАТЬСЯ КАЖДЫЕ 5 ЧАСОВ
  schedule:
    - cron: '0 */5 * * *'

jobs:
  run-everything:
    runs-on: ubuntu-latest
    # ЭТОТ ТАЙМАУТ НЕ ДАЕТ БОТУ УМЕРЕТЬ РАНЬШЕ ВРЕМЕНИ
    timeout-minutes: 340 
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with: { node-version: '24' }
          
      - name: Install
        run: npm install

      # Бот запускается в фоне и живет, пока не истечет timeout-minutes
      - name: Run Bank Bot
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node bot.js &

      # Деплой сайта (создаем папку dist, чтобы не ломать исходники)
      - name: Prepare and Deploy
        run: |
          mkdir -p dist
          # Копируем только нужные файлы, исключая папку dist, чтобы не было ошибки
          find . -maxdepth 1 -not -name 'dist' -not -name '.git' -not -name '.github' -exec cp -r {} dist/ \;
          sed -i "s|URL_SUPABASE|${{ secrets.SUPABASE_URL }}|g" dist/index.html
          sed -i "s|KEY_SUPABASE|${{ secrets.SUPABASE_KEY }}|g" dist/index.html

      - name: Deploy
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'
          
