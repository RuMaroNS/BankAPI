name: CI/CD Pipeline
on: [push]

jobs:
  run-everything:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Setup Node
        uses: actions/setup-node@v3
        with: { node-version: '18' }

      - name: Install
        run: npm install telegraf @supabase/supabase-js

      # 1. Запуск бота в фоне
      - name: Run Bot
        run: node bot.js &
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}

      # 2. Подстановка реальных ключей в сайт
      - name: Inject Secrets
        run: |
          sed -i "s|URL_SUPABASE|${{ secrets.SUPABASE_URL }}|g" index.html
          sed -i "s|KEY_SUPABASE|${{ secrets.SUPABASE_KEY }}|g" index.html

      # 3. Деплой сайта
      - name: Deploy
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          
